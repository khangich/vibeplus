# fly.toml app configuration file generated for vibecoder-frontend on 2025-10-01T13:11:02-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vibecoder-frontend'
primary_region = 'sjc'

[build]
  dockerfile = '../docker/frontend.Dockerfile'

[build.args]
  NEXT_PUBLIC_BACKEND_URL = 'https://vibecoder-backend-plus.fly.dev'
  PREVIEW_BASE_HOST = 'https://preview.vibe.llmlab.io'

[env]
  NEXT_PUBLIC_BACKEND_URL = 'https://vibecoder-backend-plus.fly.dev'
  PREVIEW_BASE_HOST = 'https://preview.vibe.llmlab.io'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
