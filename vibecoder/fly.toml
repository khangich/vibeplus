# fly.toml app configuration file generated for vibecoder-backend-wispy-smoke-6293 on 2025-10-01T12:47:04-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vibecoder-backend-wispy-smoke-6293'
primary_region = 'sjc'

[build]
  dockerfile = 'docker/backend.Dockerfile'

[env]
  BACKEND_PORT = '8000'

[processes]
  backend = 'uvicorn backend.main:app --host 0.0.0.0 --port 8000'
  frontend = 'npm run start --prefix frontend -- --port 8080'

[[services]]
  protocol = 'tcp'
  internal_port = 8000
  processes = ['backend']

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  processes = ['frontend']

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
