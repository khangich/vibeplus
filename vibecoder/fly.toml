app = "vibecoder"
primary_region = "sjc"

[build]
  dockerfile = "docker/backend.Dockerfile"

[env]
  BACKEND_PORT = "8000"

[[services]]
  internal_port = 8000
  processes = ["backend"]
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

[[services]]
  internal_port = 8080
  processes = ["frontend"]
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

[processes]
  backend = "uvicorn backend.main:app --host 0.0.0.0 --port 8000"
  frontend = "npm run start --prefix frontend -- --port 8080"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

