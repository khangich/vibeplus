# fly.toml app configuration file generated for vibecoder-backend-nameless-cherry-3571 on 2025-10-01T13:04:43-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vibecoder-backend-plus'
primary_region = 'sjc'

[build]
  dockerfile = '../docker/backend.Dockerfile'

[env]
  BACKEND_PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
