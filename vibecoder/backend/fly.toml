# fly.toml app configuration file generated for vibecoder-backend-nameless-cherry-3571 on 2025-10-01T13:04:43-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vibecoder-backend-plus'
primary_region = 'sjc'

[build]
  dockerfile = '../docker/backend.Dockerfile'

[env]
  BACKEND_PORT = '8000'
  PREVIEW_BASE_HOST = "preview.${FLY_APP_NAME}.fly.dev"
  # S3/R2 endpoints (set secrets below), frontend will call this:
  CORS_ORIGINS = "https://vibe.llmlab.io,https://vibecoder-frontend-plus.fly.dev"


[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
