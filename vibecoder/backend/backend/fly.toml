app = "vibecoder-backend"
primary_region = "sjc"

[build]
  dockerfile = "../docker/backend.Dockerfile"

[env]
  BACKEND_PORT = "8000"

[processes]
  app = "uvicorn backend.main:app --host 0.0.0.0 --port 8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
