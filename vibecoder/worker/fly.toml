# worker/fly.toml
app = "vibecoder-worker"
primary_region = "sjc"

[build]
  context = ".."
  dockerfile = "../docker/worker.Dockerfile"  # <- note the ../ and file name

[env]
  BACKEND_INTERNAL_URL = "https://vibecoder-backend-plus.fly.dev"

[processes]
  worker = "python -m worker"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
