[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibecoder-worker"
version = "0.1.0"
description = "RQ worker for Vibecoder"
requires-python = ">=3.12"
dependencies = [
  "redis==5.0.4",
  "rq==1.16.2",
  "structlog==24.1.0",
  "sqlmodel==0.0.16",
  "pydantic==2.6.4",
  "minio==7.2.6",
  "openai==1.14.3",
  "psycopg2-binary==2.9.9",
]

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.pytest.ini_options]
markers = [
  "integration: marks tests that exercise external services",
]
