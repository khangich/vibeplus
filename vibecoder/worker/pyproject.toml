[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibecoder-worker"
version = "0.1.0"
description = "RQ worker for Vibecoder"
requires-python = ">=3.12"
dependencies = [
  "redis==5.0.4",
  "rq==1.16.2",
  "structlog==24.1.0",
  "sqlmodel==0.0.16",
  "pydantic==2.6.4",
  "minio==7.2.6",
]

[tool.setuptools.packages.find]
where = ["worker"]
